name: ScholarFlow MCP

on:
  pull_request:
    paths:
      - "backend/packages/scholarflow-mcp/**"
      - "skills/public/systematic-literature-review/**"
      - "extensions_config.example.json"
      - "Makefile"
      - ".github/workflows/scholarflow-mcp.yml"
  push:
    branches: [main]
    paths:
      - "backend/packages/scholarflow-mcp/**"
      - "skills/public/systematic-literature-review/**"
      - "extensions_config.example.json"
      - "Makefile"
      - ".github/workflows/scholarflow-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholarflow-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/packages/scholarflow-mcp

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/packages/scholarflow-mcp/uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit and MCP protocol tests
        run: uv run pytest tests -q

      - name: Validate integrated literature-review Skill
        env:
          PYTHONUTF8: "1"
        run: |
          uv run --with PyYAML python ../../../skills/public/skill-creator/scripts/quick_validate.py ../../../skills/public/systematic-literature-review
          uv run python -m json.tool ../../../skills/public/systematic-literature-review/evals/evals.json > /dev/null

      - name: Synthetic deduplication regression gate
        run: >-
          uv run scholarflow-dedup-benchmark
          --min-precision 1.0
          --min-recall 1.0
          --min-f1 1.0

      - name: CLI contract smoke test
        run: uv run scholarflow-search --help

      - name: Evidence locator smoke test
        run: uv run scholarflow-verify-evidence examples/evidence_input.json

      - name: Build wheel and source distribution
        run: uv build
